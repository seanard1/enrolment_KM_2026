    // ==========================================

    const years = ['2015-2016','2016-2017','2017-2018','2018-2019','2019-2020','2020-2021','2021-2022','2022-2023','2023-2024','2024-2025'];

    const map = L.map('map').setView([43.255, -79.87], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const groups = {
        "df_HWDSB_Elementary": L.layerGroup().addTo(map),
        "df_HWDSB_Secondary": L.layerGroup().addTo(map),
        "df_HWCDSB_Elementary": L.layerGroup().addTo(map),
        "df_HWCDSB_Secondary": L.layerGroup().addTo(map)
    };

    L.control.layers(null, {
        "Public Elementary": groups["df_HWDSB_Elementary"],
        "Public Secondary": groups["df_HWDSB_Secondary"],
        "Catholic Elementary": groups["df_HWCDSB_Elementary"],
        "Catholic Secondary": groups["df_HWCDSB_Secondary"]
    }, { collapsed: false }).addTo(map);

    function getColor(p) {
        if (p <= 0.85) return "#2c7bb6";
        if (p <= 0.95) return "#abd9e9";
        if (p <= 1.00) return "#ffffbf";
        if (p <= 1.10) return "#fdae61";
        return "#d7191c";
    }

    function getRadius(enrol) {
        return Math.sqrt(enrol) * 0.7;
    }

    function update() {
        Object.values(groups).forEach(g => g.clearLayers());
        const yr = years[document.getElementById('ySlider').value];
        
        data.filter(d => d.year === yr).forEach(d => {
            if (groups[d.layer]) {
                const circle = L.circleMarker([d.lat, d.lng], {
                    radius: getRadius(d.enrolment),
                    fillColor: getColor(d.pressure),
                    color: "#333", weight: 0.5, fillOpacity: 0.8
                });
                
                circle.bindPopup(`
                    <div style="font-size:14px;">
                        <strong style="font-size:15px;">${d.school}<\/strong><br>
                        <b>Year:<\/b> ${d.year}<br>
                        <b>Enrolment:<\/b> ${d.enrolment}<br>
                        <b>Capacity:<\/b> ${d.capacity}<br>
                        <b>Pressure:<\/b> <span style="color:${getColor(d.pressure)}; font-weight:bold;">${(d.pressure * 100).toFixed(1)}%<\/span>
                    </div>
                `);
                circle.addTo(groups[d.layer]);
            }
        });
    }

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        div.innerHTML = `
            <h4>Map Legend<\/h4>
            <strong>Utilization (colour)<\/strong>
            <div class="legend-item"><div class="legend-color" style="background:#d7191c"><\/div> >110% (crowded)<\/div>
            <div class="legend-item"><div class="legend-color" style="background:#fdae61"><\/div> 100-110% (over)<\/div>
            <div class="legend-item"><div class="legend-color" style="background:#ffffbf"><\/div> 95-100% (full)<\/div>
            <div class="legend-item"><div class="legend-color" style="background:#2c7bb6"><\/div> <85% (under)<\/div>
            <hr>
            <strong>Enrolment (Size)<\/strong>
            <div class="legend-item"><div class="size-demo" style="width:10px; height:10px;"><\/div> smaller school<\/div>
            <div class="legend-item"><div class="size-demo" style="width:25px; height:25px;"><\/div> larger school<\/div>
        `;
        return div;
    };
    legend.addTo(map);

    document.getElementById('ySlider').oninput = (e) => {
        document.getElementById('yLabel').innerText = years[e.target.value];
        update();
    };

    document.getElementById('mSearch').oninput = (e) => {
        const v = e.target.value.toLowerCase();
        if (v.length < 3) return;
        const match = data.find(d => d.school.toLowerCase().includes(v));
        if (match) {
            map.flyTo([match.lat, match.lng], 14);
            L.popup().setLatLng([match.lat, match.lng])
                .setContent("<b>" + match.school + "<\/b>")
                .openOn(map);
        }
    };

    update();
})();
