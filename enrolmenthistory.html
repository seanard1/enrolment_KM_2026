<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamilton School Capacity Map</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
>

<style>
:root{
    --header:#2c3e50;
    --blue:#3498db;
    --border:#dcdcdc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:#fff;
}

#app{
    width:100%;
}

.header-bar{
    background:var(--header);
    color:#fff;
    padding:15px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
    z-index:1000;
}

.controls{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.search-box{
    width:300px;
    max-width:100%;
    padding:8px 10px;
    border:none;
    border-radius:4px;
    font-size:14px;
}

#yearLabel{
    color:var(--blue);
    font-weight:700;
    min-width:100px;
}

#map{
    width:100%;
    height:700px;
}

.info.legend{
    background:#fff;
    padding:15px;
    border-radius:8px;
    border:1px solid var(--border);
    box-shadow:0 0 15px rgba(0,0,0,.2);
    color:#333;
    font-size:13px;
}

.legend h4{
    margin:0 0 10px;
}

.legend-item{
    display:flex;
    align-items:center;
    margin-bottom:6px;
}

.legend-color{
    width:16px;
    height:16px;
    border-radius:50%;
    margin-right:10px;
    border:1px solid #666;
}

.size-demo{
    border-radius:50%;
    border:1px solid #666;
    background:#ddd;
    margin-right:10px;
    display:inline-block;
}

hr{
    border:none;
    border-top:1px solid #eee;
    margin:10px 0;
}

@media (max-width:768px){

    .header-bar{
        align-items:flex-start;
    }

    .search-box{
        width:100%;
    }

    #map{
        height:600px;
    }
}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

<!-- Contains: window.schoolData = [...] -->
<script src="data.js" defer></script>

<script defer>
document.addEventListener('DOMContentLoaded', init);

function init(){

    if(!window.schoolData){
        document.getElementById('map').innerHTML =
            '<div style="padding:20px">Unable to load school data.</div>';
        return;
    }

    const data = window.schoolData;

    const years = [...new Set(data.map(d => d.year))].sort();

    const map = L.map('map').setView([43.2557, -79.8711], 11);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:
            '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    let markers = [];

    const slider = document.getElementById('yearSlider');
    const yearLabel = document.getElementById('yearLabel');
    const search = document.getElementById('searchBox');

    slider.max = years.length - 1;
    slider.value = years.length - 1;

    function pressureColor(value){

        if(value >= 1.2) return '#d73027';
        if(value >= 1.0) return '#fc8d59';
        if(value >= 0.8) return '#fee08b';

        return '#91cf60';
    }

    function draw(){

        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const selectedYear =
            years[Number(slider.value)];

        yearLabel.textContent = selectedYear;

        const searchTerm =
            search.value.trim().toLowerCase();

        const filtered = data.filter(row => {

            if(row.year !== selectedYear){
                return false;
            }

            if(
                searchTerm &&
                !row.school.toLowerCase().includes(searchTerm)
            ){
                return false;
            }

            return true;
        });

        filtered.forEach(row => {

            const radius =
                Math.max(
                    5,
                    Math.min(
                        25,
                        (row.portables || 0) + 5
                    )
                );

            const marker = L.circleMarker(
                [row.lat,row.lng],
                {
                    radius,
                    fillColor:
                        pressureColor(row.pressure),
                    color:'#333',
                    weight:1,
                    fillOpacity:.8
                }
            );

            marker.bindPopup(`
                <strong>${row.school}</strong><br>
                Year: ${row.year}<br>
                Enrolment: ${row.enrolment}<br>
                Capacity: ${row.capacity}<br>
                Pressure: ${(row.pressure*100).toFixed(1)}%<br>
                Portables: ${row.portables || 0}<br>
                Portapaks: ${row.Portapaks || 0}
            `);

            marker.addTo(map);
            markers.push(marker);
        });
    }

    slider.addEventListener('input', draw);
    search.addEventListener('input', draw);

    addLegend(map);
    draw();
}

function addLegend(map){

    const legend = L.control({position:'bottomright'});

    legend.onAdd = function(){

        const div =
            L.DomUtil.create(
                'div',
                'info legend'
            );

        div.innerHTML = `
            <h4>Capacity Pressure</h4>

            <div class="legend-item">
                <span class="legend-color"
                    style="background:#d73027"></span>
                120%+
            </div>

            <div class="legend-item">
                <span class="legend-color"
                    style="background:#fc8d59"></span>
                100-119%
            </div>

            <div class="legend-item">
                <span class="legend-color"
                    style="background:#fee08b"></span>
                80-99%
            </div>

            <div class="legend-item">
                <span class="legend-color"
                    style="background:#91cf60"></span>
                Under 80%
            </div>
        `;

        return div;
    };

    legend.addTo(map);
}
</script>

</head>

<body>

<div id="app">

    <div class="header-bar">

        <div class="controls">
            <strong>School Year:</strong>

            <input
                type="range"
                id="yearSlider"
                min="0"
                value="0"
            >

            <span id="yearLabel"></span>
        </div>

        <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="Search school name..."
        >

    </div>

    <div id="map"></div>

</div>

</body>
</html>
